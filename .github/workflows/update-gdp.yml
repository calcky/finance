name: Update GDP data

on:
  schedule:
    - cron: '17 22 * * *' # 06:17 Asia/Shanghai the next day
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-gdp.yml'
      - 'scripts/sync_gdp.py'
      - 'scripts/render_learning_charts.py'
      - 'scripts/requirements-plots.txt'
      - 'tests/test_sync_gdp.py'

permissions:
  contents: read

concurrency:
  group: update-gdp
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            docs/requirements.txt
            scripts/requirements-plots.txt
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-droid-fallback
          python -m pip install -r docs/requirements.txt -r scripts/requirements-plots.txt
      - name: Test data validation
        run: python -m unittest discover -s tests -v
      - name: Fetch and generate
        run: python scripts/sync_gdp.py
      - name: Verify documentation
        run: |
          python -m sphinx -n -W --keep-going -b html docs _build/html
          git diff --check
      - name: Publish only validated changes
        run: |
          git add data/gdp.csv data/gdp.metadata.json docs/data/gdp.md docs/images/data/gdp-*.svg
          if git diff --cached --quiet; then
            echo "GDP snapshot unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: refresh World Bank GDP snapshot'
          git push origin HEAD:main
