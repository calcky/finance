name: Update macro data

on:
  schedule:
    - cron: '17 22 * * *' # 06:17 Asia/Shanghai the next day
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Recheck all historical archives (can take 1–2 hours)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-gdp.yml'
      - 'scripts/sync_gdp.py'
      - 'scripts/sync_macro.py'
      - 'scripts/sync_data.py'
      - 'scripts/source_http.py'
      - 'scripts/macro_*.py'
      - 'data/reference/property-early-releases.json'
      - 'data/reference/population-households.json'
      - 'scripts/requirements-data.txt'
      - 'scripts/render_learning_charts.py'
      - 'scripts/requirements-plots.txt'
      - 'tests/test_sync_gdp.py'
      - 'tests/test_sync_resilience.py'
      - 'tests/test_*history.py'
      - 'tests/fixtures/**'
      - 'tests/test_macro.py'
      - 'tests/test_overview.py'
      - 'tests/test_quarterly_gdp.py'
      - 'tests/test_credit_structure.py'
      - 'docs/conf.py'
      - 'docs/_static/**'
      - 'tests/browser/**'

permissions:
  contents: read

concurrency:
  group: update-gdp
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            docs/requirements.txt
            scripts/requirements-plots.txt
            scripts/requirements-data.txt
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-droid-fallback
          python -m pip install -r docs/requirements.txt -r scripts/requirements-plots.txt -r scripts/requirements-data.txt
      - name: Fetch and generate
        id: fetch
        continue-on-error: true
        shell: bash
        env:
          FULL_HISTORY: ${{ inputs.backfill }}
        run: |
          {
            if [ "$FULL_HISTORY" = 'true' ] || { [ '${{ github.event_name }}' = 'schedule' ] && [ "$(date -u +%d)" = '01' ]; }; then
              python scripts/sync_data.py --backfill --report-dir "$RUNNER_TEMP/finance-sync"
            else
              python scripts/sync_data.py --report-dir "$RUNNER_TEMP/finance-sync"
            fi
          } 2>&1 | tee "$RUNNER_TEMP/finance-fetch.log"
      - name: Regenerate overview from validated snapshots
        run: python scripts/macro_overview.py
      - name: Test data validation
        run: python -m unittest discover -s tests -v
      - name: Verify documentation
        run: |
          python -m sphinx -n -W --keep-going -b html docs _build/html
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Install browser test dependencies
        working-directory: tests/browser
        run: |
          npm ci
          google-chrome --version
      - name: Verify interactive charts
        env:
          GDP_BROWSER_CHANNEL: chrome
        run: |
          python -m http.server 8767 --bind 127.0.0.1 --directory _build/html > "$RUNNER_TEMP/gdp-http.log" 2>&1 &
          gdp_server_pid=$!
          trap 'kill "$gdp_server_pid"' EXIT
          node tests/browser/gdp.cjs
          node tests/browser/macro.cjs
          node tests/browser/overview.cjs
          node tests/browser/amd.cjs
      - name: Publish only validated changes
        run: |
          git add data/gdp.csv data/gdp.metadata.json docs/data/gdp.md docs/images/data/gdp-*.svg
          git add data/macro docs/data/prices.md docs/data/money-credit.md docs/data/rates.md docs/data/activity.md docs/data/employment-income.md docs/data/trade-fx.md docs/images/data/macro-*.svg
          git add docs/data/overview.md
          git add docs/data/quarterly-gdp.md
          git add docs/data/credit-structure.md
          git add docs/data/property.md
          git add docs/data/housing-prices.md docs/data/housing-wealth.md docs/data/population.md docs/data/shanghai-population.md

          git add docs/data/fiscal.md
          git add docs/data/us-rates.md
          git add data/update-status.json docs/data/update-status.md
          if git diff --cached --quiet; then
            echo "Macro snapshots unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: refresh official macro snapshots'
          git push origin HEAD:main
      - name: Retain complete source logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-sync-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/finance-fetch.log
            ${{ runner.temp }}/finance-sync/
          if-no-files-found: warn
          retention-days: 14
      - name: Report incomplete synchronization
        if: always() && steps.fetch.outcome == 'failure'
        run: |
          echo '::error::Some topics could not refresh. Validated topics were eligible for publication; failed topics retained their previous snapshots. See the per-topic summary and log artifact.'
          exit 1
